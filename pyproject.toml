[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "gp"
version = "0.1.0"
description = "A minimal Python project scaffold."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "black>=23.12,<25",
  "ruff>=0.1,<1",
  "mypy>=1.8,<2",
]

[project.scripts]
gp = "gp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
